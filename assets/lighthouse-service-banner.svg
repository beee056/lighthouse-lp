<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2744"/>
      <stop offset="100%" style="stop-color:#0d1a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e55f3a"/>
      <stop offset="100%" style="stop-color:#f07a55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="0"/>

  <!-- Decorative light beam -->
  <polygon points="400,0 600,450 200,450" fill="rgba(229,95,58,0.06)"/>
  <polygon points="400,0 700,450 350,450" fill="rgba(229,95,58,0.04)"/>

  <!-- Top label -->
  <rect x="40" y="36" width="240" height="28" rx="14" fill="rgba(229,95,58,0.2)"/>
  <text x="160" y="55" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="700" fill="#e55f3a" text-anchor="middle" letter-spacing="1">総合型選抜専門コーチング</text>

  <!-- Main logo -->
  <text x="40" y="130" font-family="'Noto Sans JP', Georgia, serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="2">LIGHTHOUSE</text>

  <!-- Tagline -->
  <text x="40" y="168" font-family="'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,0.75)">「なぜ、あなたなのか。」を、言葉にする。</text>

  <!-- Accent line -->
  <rect x="40" y="190" width="60" height="3" rx="2" fill="url(#accent)"/>

  <!-- Stats row -->
  <g transform="translate(40, 230)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="160" height="80" rx="12" fill="rgba(255,255,255,0.07)"/>
    <text x="80" y="32" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="800" fill="#e55f3a" text-anchor="middle">88%</text>
    <text x="80" y="52" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">合格率</text>
    <text x="80" y="68" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">94件中82件合格</text>

    <!-- Stat 2 -->
    <rect x="176" y="0" width="160" height="80" rx="12" fill="rgba(255,255,255,0.07)"/>
    <text x="256" y="32" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">月額制</text>
    <text x="256" y="52" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">料金体系</text>
    <text x="256" y="68" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">高額一括払い不要</text>

    <!-- Stat 3 -->
    <rect x="352" y="0" width="160" height="80" rx="12" fill="rgba(255,255,255,0.07)"/>
    <text x="432" y="32" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">完全個別</text>
    <text x="432" y="52" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">指導形式</text>
    <text x="432" y="68" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">オンライン対応</text>
  </g>

  <!-- Course list -->
  <g transform="translate(40, 338)">
    <text x="0" y="0" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">COURSES</text>
    <text x="0" y="24" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">▶  探究スタート  /  伴走コース  /  直前集中  /  スポット相談</text>
  </g>

  <!-- Right side: CTA box -->
  <rect x="560" y="220" width="200" height="130" rx="16" fill="url(#accent)"/>
  <text x="660" y="258" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">まずは無料相談</text>
  <text x="660" y="282" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">30分・オンライン</text>
  <text x="660" y="302" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">無理な勧誘なし</text>
  <rect x="590" y="316" width="140" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="660" y="332" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">LINEで気軽に相談する →</text>

  <!-- Bottom bar -->
  <rect x="0" y="418" width="800" height="32" fill="rgba(0,0,0,0.3)"/>
  <text x="40" y="439" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">lp.p-quest.com  |  PIVOT &amp; QUEST Inc.  |  info@p-quest.com</text>
</svg>
