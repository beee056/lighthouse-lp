name: Weekly Data Scraper

on:
  schedule:
    # 毎週日曜日の深夜2時 (UTCで土曜日の17:00)
    - cron: '0 17 * * 6'
  workflow_dispatch:
    # 手動実行も可能にする

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: node scripts/scraper.js

      # 慶應公式サイトの構造変更などで失敗しても、大学一覧データの更新は止めない
      - name: Run Keio Scraper
        continue-on-error: true
        run: node scripts/keio-scraper.js

      # 早稲田・GMARCHの要項をClaude APIで構造化抽出。
      # ANTHROPIC_API_KEY (Secrets)未設定時はスクリプト側で何もせず正常終了する
      - name: Run University Details Scraper (AI)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/uni-details-scraper.js

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git add keio-data.json || true
          git add uni-details.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): auto-update university data"
          git push
